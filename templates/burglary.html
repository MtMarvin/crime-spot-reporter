<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Report Housebreaking / Burglary - Crime Spot Reporter</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <header>
        <div class="logo">Crime Spot Reporter</div>

        <button class="menu-button" onclick="toggleMenu()">
            ☰
        </button>
    </header>

    <main>

        <section class="categories">

            <h1>Report Housebreaking / Burglary</h1>

            <p>
                Provide as much information as possible about the incident.
            </p>

            <form action="/submit-burglary" method="POST" enctype="multipart/form-data">

                <label for="date">Date of incident</label>
                <input type="date" id="date" name="date" required>

                <br><br>

                <label for="time">Approximate time</label>
                <input type="time" id="time" name="time" required>

                <br><br>

                <label for="location">Location of incident</label>
                <input
                    type="text"
                    id="location"
                    name="location"
                    placeholder="Enter the location"
                    required
                >

                <br><br>

                <label for="property">Type of property</label>
                <select id="property" name="property" required>
                    <option value="">Select property type</option>
                    <option value="House">House</option>
                    <option value="Apartment / Flat">Apartment / Flat</option>
                    <option value="Business">Business</option>
                    <option value="School">School</option>
                    <option value="Other">Other</option>
                </select>

                <br><br>

                <label for="entry">How did the suspect(s) gain entry?</label>
                <textarea
                    id="entry"
                    name="entry"
                    rows="4"
                    placeholder="Describe how entry was gained"
                    required
                ></textarea>

                <br><br>

                <label for="stolen">What was stolen or damaged?</label>
                <textarea
                    id="stolen"
                    name="stolen"
                    rows="4"
                    placeholder="Describe stolen or damaged property"
                    required
                ></textarea>

                <br><br>

                <label for="suspect">Suspect information</label>
                <textarea
                    id="suspect"
                    name="suspect"
                    rows="4"
                    placeholder="Describe the suspect(s) if known"
                ></textarea>

                <br><br>

                <label for="description">Additional information</label>
                <textarea
                    id="description"
                    name="description"
                    rows="5"
                    placeholder="Provide any other information about the incident"
                ></textarea>

                <br><br>

                <label for="evidence">Photo or short video evidence</label>
                <input
                    type="file"
                    id="evidence"
                    name="evidence"
                    accept="image/*,video/*"
                >

                <br><br>

                <button type="submit" class="report-button">
                    Submit Burglary Report
                </button>

            </form>

        </section>

    </main>

    <footer>

        <p>
            If you are in immediate danger, contact emergency services.
        </p>

        <p>
            © 2026 Crime Spot Reporter
        </p>

    </footer>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>

</html>
