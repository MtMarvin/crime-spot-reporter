<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Report Theft - Crime Spot Reporter</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <header>
        <div class="logo">Crime Spot Reporter</div>

        <button class="menu-button" onclick="toggleMenu()">
            ☰
        </button>
    </header>

    <main>

        <section class="categories">

            <h1>Report Theft</h1>

            <p>
                Provide as much information as possible about the theft.
            </p>

            <form action="/submit-theft" method="POST" enctype="multipart/form-data">

                <label for="date">Date of incident</label>
                <input type="date" id="date" name="date" required>

                <br><br>

                <label for="time">Approximate time</label>
                <input type="time" id="time" name="time" required>

                <br><br>

                <label for="location">Location of incident</label>
                <input
                    type="text"
                    id="location"
                    name="location"
                    placeholder="Enter the location"
                    required
                >

                <br><br>

                <label for="items">What was stolen?</label>
                <textarea
                    id="items"
                    name="items"
                    rows="4"
                    placeholder="Describe the stolen items"
                    required
                ></textarea>

                <br><br>

                <label for="value">Estimated value of stolen items</label>
                <input
                    type="number"
                    id="value"
                    name="value"
                    placeholder="Enter amount in Rand"
                    min="0"
                >

                <br><br>

                <label for="description">Additional information</label>
                <textarea
                    id="description"
                    name="description"
                    rows="5"
                    placeholder="Provide any other information about the incident"
                ></textarea>

                <br><br>

                <label for="evidence">Photo or short video evidence</label>
                <input
                    type="file"
                    id="evidence"
                    name="evidence"
                    accept="image/*,video/*"
                >

                <br><br>

                <button type="submit" class="report-button">
                    Submit Theft Report
                </button>

            </form>

        </section>

    </main>

    <footer>

        <p>
            If you are in immediate danger, contact emergency services.
        </p>

        <p>
            © 2026 Crime Spot Reporter
        </p>

    </footer>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>

</html>
