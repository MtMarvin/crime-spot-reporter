<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robbery Report - Crime Spot Reporter</title>
</head>

<body>

    <h1>Report Robbery</h1>

    <form action="/submit-robbery" method="POST">

        <label for="date">Date of incident:</label><br>
        <input type="date" id="date" name="date" required><br><br>

        <label for="time">Time of incident:</label><br>
        <input type="time" id="time" name="time" required><br><br>

        <label for="location">Location of incident:</label><br>
        <input type="text" id="location" name="location" required><br><br>

        <label for="weapon">Was a weapon used?</label><br>
        <select id="weapon" name="weapon" required>
            <option value="">-- Select --</option>
            <option value="Yes">Yes</option>
            <option value="No">No</option>
            <option value="Unknown">Unknown</option>
        </select><br><br>

        <label for="items">Items or property taken:</label><br>
        <textarea id="items" name="items" rows="4" required></textarea><br><br>

        <label for="suspect">Suspect description:</label><br>
        <textarea id="suspect" name="suspect" rows="4"></textarea><br><br>

        <label for="description">Additional information:</label><br>
        <textarea id="description" name="description" rows="5"></textarea><br><br>

        <button type="submit">Submit Robbery Report</button>

    </form>

</body>

</html>
